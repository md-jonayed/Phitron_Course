{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% load static %}

{% block title %}
  <title>Task Manager | Add Category</title>
{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <!-- Card wrapper -->
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h3 class="card-title mb-4 text-center text-primary">
            <i class="fas fa-folder-plus me-2"></i>Add a New Category
          </h3>

          <!-- Form -->
          <form method="post" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">
                <i class="fas fa-plus-circle me-1"></i> Submit
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
