{% extends 'base.html' %}
{% load static %}

{% block title %}
<title>Welcome | Auth Page</title>
{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
  <div class="card shadow-lg border-0 rounded-4 p-4" style="max-width: 900px; width: 100%;">
    <div class="row g-0 align-items-center">
      <!-- Image Section -->
      <div class="col-md-6">
        <img
          src="https://img.freepik.com/premium-vector/privacy-policy-concept-illustration_114360-7853.jpg?semt=ais_hybrid&w=740"
          alt="Authentication"
          class="img-fluid rounded-start-4"
        />
      </div>

      <!-- Text Section -->
      <div class="col-md-6 text-center px-4">
        <h2 class="fw-bold mb-3 mt-3 mt-md-0">Secure Your Identity</h2>
        <p class="text-muted mb-4">
          Welcome to our secure authentication platform. Sign up to get started or log in if you already have an account.
        </p>
      </div>
    </div>

    <!-- Buttons Section -->
    <div class="d-flex justify-content-center mt-4 gap-3">
      <a href="{% url 'register' %}" class="btn btn-warning btn-lg px-4">
        <i class="bi bi-person-plus-fill"></i> Register
      </a>
      <a href="{% url 'login' %}" class="btn btn-success btn-lg px-4">
        <i class="bi bi-box-arrow-in-right"></i> Login
      </a>
    </div>
  </div>
</div>
{% endblock %}
