<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />

    {% block title %}
    <title>Authentication App</title>
    {% endblock %}
  </head>
  <body class="bg-light text-dark">
    <nav
      class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm"
    >
      <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">
          Authentication
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
          aria-controls="navbarContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarContent"
        >
          <div class="d-flex">
            {% if user.is_authenticated %}
            <a href="{% url 'profile' %}" class="btn btn-outline-primary me-2">
              <i class="bi bi-person-circle"></i> Profile
            </a>
            <a href="{% url 'logout' %}" class="btn btn-outline-danger">
              <i class="bi bi-box-arrow-right"></i> Logout
            </a>
            {% else %}
            <a href="{% url 'register' %}" class="btn btn-outline-warning me-2">
              <i class="bi bi-person-plus"></i> Register 
            </a>
            <a href="{% url 'login' %}" class="btn btn-outline-success">
              <i class="bi bi-box-arrow-in-right"></i> Login
            </a>
            {% endif %}
          </div>
        </div>
      </div>
    </nav>

    <main class="container mt-5">{% block content %} {% endblock %}</main>

    <!-- Bootstrap JS Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>

    {% block scripts %}
    <!-- Additional page-specific scripts -->
    {% endblock %}
  </body>
</html>
