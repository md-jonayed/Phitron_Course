{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}
<title>CarZ | Change Password</title>
{% endblock %}

{% block content %}
<div class="container my-5 d-flex justify-content-center">
    <div class="card shadow-lg rounded-4 border-0 p-0" style="max-width: 500px; overflow: hidden;">
        <div class="card-header bg-dark text-white text-center py-4">
            <h3 class="mb-0 fw-bold">🔒 Change Password</h3>
        </div>
        
        <div class="card-body p-4 bg-light">
            <p class="text-muted text-center mb-4">
                Enter your current password and choose a new one
            </p>
            
            <form method="post" class="d-grid gap-3">
                {% csrf_token %}
                {{ form|crispy }}
                
                <button type="submit" class="btn btn-primary btn-lg rounded-pill shadow-sm fw-bold py-2">
                    Change Password
                </button>
            </form>
        </div>
        
        <div class="card-footer text-center bg-light py-3">
            <a href="{% url 'profile' %}" class="text-decoration-none text-primary fw-bold">
                ← Back to Profile
            </a>
        </div>
    </div>
</div>

<style>
.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    transition: all 0.3s ease;
}

.btn-primary:hover {
    background-color: #0b5ed7;
    transform: translateY(-2px);
    transition: all 0.2s ease;
}

@media (max-width: 576px) {
    .card { margin: 0 1rem; }
}
</style>
{% endblock %}
