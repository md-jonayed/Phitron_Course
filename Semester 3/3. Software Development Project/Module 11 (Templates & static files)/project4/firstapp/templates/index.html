{% extends 'base.html' %}
{% load static %}

{% block content %}
{{block.super}} <h2>Child</h2>
<h1>This is index page</h1>
    <table class="table">
      <thead>
        <tr>
          <th scope="col">Id</th>
          <th scope="col">Name</th>
          <th scope="col">Email</th>
          <th scope="col">Address</th>
        </tr>
      </thead>
      <tbody>
        {% for user in data %}
        <tr>
          <th scope="row">{{user.id}}</th>
          <td>{{user.name}}</td>
          <td>{{user.email}}</td>
          <td>{{user.address}}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  {% endblock %}
